name: Deploy production (manual fallback)

# Production deploys run centrally from GeorgeDanicico/vps-apps.
# This workflow is kept only for manual emergency redeploys.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE || '/etc/expense-tracker/.env.production' }}
      IMAGE_NAME: expense-tracker
      CONTAINER_NAME: expense-tracker-web
    steps:
      - name: Check out latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build and deploy Docker image
        run: bash scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
