name: Notify VPS deployments

# Runs once the image for a main commit is in GHCR, so the VPS deploy can pull it straight away.
on:
  workflow_run:
    workflows: [Build image]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wake the central deployment workflow
        env:
          GH_TOKEN: ${{ secrets.VPS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::VPS_DISPATCH_TOKEN is not set; vps-apps will pick up this commit on its next scheduled sync."
            exit 0
          fi
          gh api --method POST repos/GeorgeDanicico/vps-apps/dispatches \
            -f event_type=upstream-changed
