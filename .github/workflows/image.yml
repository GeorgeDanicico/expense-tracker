name: Build image

# Builds the production image on GitHub's runners and pushes it to GHCR, so the VPS only pulls it
# (scripts/deploy.sh with IMAGE_SOURCE=pull). Tagged with the full commit SHA and latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/georgedanicico/expense-tracker

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker first, so a secret in the image is caught before anything is pushed.
      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: expense-tracker:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Copy the app out of the image and search it: the browser files for secret patterns and
      # server-only variable names, the whole tree for patterns, key files and .env files.
      - name: Scan the image for secrets
        run: |
          set -euo pipefail
          id=$(docker create expense-tracker:scan)
          mkdir "$RUNNER_TEMP/image-fs"
          docker cp "$id:/app" "$RUNNER_TEMP/image-fs/app"
          docker rm "$id" > /dev/null
          bash scripts/scan-build-secrets.sh --self-test
          bash scripts/scan-build-secrets.sh "$RUNNER_TEMP/image-fs/app/.next/static" "$RUNNER_TEMP/image-fs/app/public"
          bash scripts/scan-build-secrets.sh --server "$RUNNER_TEMP/image-fs/app"

      # Same inputs as the build above, so every layer comes from the cache.
      - name: Push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
